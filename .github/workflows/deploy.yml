# DÉSACTIVÉ pour l'instant : déclenchement manuel uniquement.
# À activer (trigger push sur main) quand le VPS OVH et le domaine seront prêts.
# Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé dédiée, sans passphrase, accès limité).
name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/julien-d234/portfolio_v3:latest
            ghcr.io/julien-d234/portfolio_v3:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Déploiement SSH
        run: echo "TODO : ssh vers le VPS, docker compose pull && up -d (à écrire avec l'accès VPS)"
